<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if current_user.tipo == 'produtor' %}Minha Fazenda{% else %}Fazendas{% endif %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #1a1a2e; }
    header {
      background: white;
      color: #10315A; padding: 10px 28px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .header-brand { display: flex; align-items: center; text-decoration: none; }
    .header-brand img { height: 110px; display: block; }
    header a.nav-link { color: #10315A; text-decoration: none; font-size: 13px; font-weight: 600; }
    header a.nav-link:hover { color: #267A25; }
    main { max-width: 900px; margin: 20px auto; padding: 0 16px; }
    .card { background: white; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    h2 { font-size: 16px; color: #10315A; margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #10315A; }
    input, textarea { width: 100%; border: 1px solid #ccc; border-radius: 6px; padding: 10px 12px; font-size: 14px; font-family: inherit; }
    input:focus, textarea:focus { outline: none; border-color: #267A25; box-shadow: 0 0 0 2px rgba(38,122,37,0.15); }
    textarea { height: 60px; resize: vertical; }
    .row { display: flex; gap: 12px; margin-bottom: 12px; }
    .row > div { flex: 1; }
    .campo { margin-bottom: 12px; }
    .unidade { font-size: 11px; color: #888; margin-top: 2px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: #10315A; color: white; border: none; border-radius: 6px;
      padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn:hover { background: #1a4070; }
    .btn-verde { background: #267A25; }
    .btn-verde:hover { background: #5FB038; }
    .btn-vermelho { background: #C62828; font-size: 12px; padding: 6px 12px; }
    .btn-vermelho:hover { background: #B71C1C; }
    .btn-editar { background: #E65100; font-size: 12px; padding: 6px 12px; }
    .btn-editar:hover { background: #BF360C; }
    .lista-vazia { text-align: center; color: #999; padding: 32px 0; font-size: 14px; }

    .fazenda-grupo {
      border: 1px solid #e0e0e0; border-radius: 8px;
      margin-bottom: 14px; background: #fafafa; overflow: hidden;
    }
    .fazenda-titulo {
      background: #10315A; color: white;
      padding: 11px 16px; font-size: 15px; font-weight: 700;
    }
    .pulv-item {
      padding: 12px 16px; border-top: 1px solid #e8edf2;
    }
    .pulv-item:first-of-type { border-top: none; }
    .pulv-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .pulv-modelo { font-size: 14px; font-weight: 700; color: #10315A; }
    .pulv-info { font-size: 12px; color: #555; line-height: 1.7; }
    .pulv-info strong { color: #333; }
    .cliente-acoes { display: flex; gap: 8px; margin-top: 10px; }

    .secao-titulo { font-size: 13px; font-weight: 700; color: #10315A; margin-bottom: 8px; margin-top: 16px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #e0e0e0; padding-bottom: 4px; }
    .config-entry { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 8px; flex-wrap: wrap; }
    .config-entry > div { flex: 1; min-width: 120px; }
    .config-entry > div.desc { flex: 2; min-width: 160px; }
    .btn-remover { background: #ef4444; color: white; border: none; border-radius: 6px; padding: 9px 12px; font-size: 13px; cursor: pointer; align-self: flex-end; white-space: nowrap; }
    .btn-remover:hover { background: #dc2626; }
    .btn-add { background: none; border: 1.5px dashed #267A25; color: #267A25; border-radius: 6px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 2px; }
    .btn-add:hover { background: #e8f5e9; }
    .btn-calcular { background: none; border: none; color: #888; font-size: 11px; cursor: pointer; padding: 2px 0; text-decoration: underline; }
    .btn-calcular:hover { color: #267A25; }

    @media (max-width: 600px) {
      .card { padding: 16px; }
      .row { flex-direction: column; gap: 0; }
      header { padding: 8px 16px 0; flex-direction: column; align-items: flex-start; gap: 2px; }
      .header-brand img { height: 52px; }
      header > div { flex-wrap: nowrap !important; overflow-x: auto; gap: 0 !important; width: 100%; scrollbar-width: none; border-top: 1px solid #e8edf2; margin-top: 6px; padding: 2px 0 8px; }
      header > div::-webkit-scrollbar { display: none; }
      header a.nav-link { font-size: 12px; white-space: nowrap; padding: 6px 12px 6px 0; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="header-brand">
      <img src="/static/logo.png" alt="FieldMix">
    </a>
    <div style="display:flex;gap:20px;align-items:center;">
      <a href="/" class="nav-link">&larr; Voltar</a>
      <a href="/logout" class="nav-link">Sair</a>
    </div>
  </header>

  <main>
    <div class="card" id="form-card">
      <h2 id="form-titulo">{% if current_user.tipo == 'produtor' %}Minha Fazenda{% else %}Nova Fazenda{% endif %}</h2>
      <input type="hidden" id="editando-id" value="">

      <div class="campo">
        <label for="nome">Nome da fazenda</label>
        <input type="text" id="nome" placeholder="Ex: Fazenda Boa Vista{% if current_user.tipo == 'consultor' %} — João{% endif %}">
      </div>

      <div class="secao-titulo">Equipamento</div>
      <div class="campo">
        <label for="pulverizador_modelo">Modelo</label>
        <input type="text" id="pulverizador_modelo" placeholder="Ex: Jacto Uniport 3030">
      </div>
      <div class="campo">
        <label for="volume_tanque">Capacidade do tanque (L)</label>
        <input type="number" id="volume_tanque" placeholder="Ex: 2000" min="1" step="1">
      </div>
      <div class="secao-titulo" style="margin-top:12px;">Pontas</div>
      <div class="campo">
        <label for="pontas">Pontas que possui</label>
        <input type="text" id="pontas" placeholder="Ex: TT110015, AIXR110015, Leque HI 35">
        <div class="unidade">Separe por virgula</div>
      </div>

      <div class="secao-titulo">Extras</div>
      <div class="campo">
        <label for="calibracao">Calibracao (opcional)</label>
        <textarea id="calibracao" placeholder="Ex: Ultima calibracao 15/09/2026 - 80 L/ha a 18 km/h com TT110015 a 2 bar"></textarea>
      </div>
      <div class="campo">
        <label for="observacao">Observacao (opcional)</label>
        <textarea id="observacao" placeholder="Ex: Sempre colocar 200L de agua antes de adicionar produtos. Tanque de pre-mistura de 50L."></textarea>
      </div>

      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <button class="btn btn-verde" onclick="salvar()">Salvar Fazenda</button>
        <button class="btn" onclick="limparForm()" style="background: #757575;">Limpar</button>
      </div>
      <div id="form-status" style="margin-top: 10px; font-size: 13px;"></div>
    </div>

    <div class="card">
      <h2>{% if current_user.tipo == 'produtor' %}Minhas Fazendas{% else %}Fazendas Cadastradas{% endif %}</h2>
      <div id="lista-clientes">
        <div class="lista-vazia">Carregando...</div>
      </div>
    </div>
  </main>

  <script>
    const API = '/api/clientes';

    async function carregarClientes() {
      const div = document.getElementById('lista-clientes');
      try {
        const resp = await fetch(API);
        const clientes = await resp.json();
        if (!clientes.length) {
          div.innerHTML = '<div class="lista-vazia">Nenhuma fazenda cadastrada ainda.</div>';
          return;
        }
        div.innerHTML = '';
        // Agrupa por fazenda: parte antes do " — " no nome
        const grupos = {};
        const ordem = [];
        clientes.forEach(function(c) {
          const sep = c.nome.indexOf(' — ');
          const fazenda = sep >= 0 ? c.nome.slice(0, sep).trim() : c.nome;
          if (!grupos[fazenda]) { grupos[fazenda] = []; ordem.push(fazenda); }
          grupos[fazenda].push(c);
        });
        ordem.forEach(function(fazenda) {
          div.appendChild(renderGrupo(fazenda, grupos[fazenda]));
        });
      } catch (e) {
        div.innerHTML = '<div class="lista-vazia" style="color:#C62828;">Erro ao carregar clientes.</div>';
      }
    }

    function renderGrupo(fazenda, clientes) {
      const wrap = document.createElement('div');
      wrap.className = 'fazenda-grupo';
      wrap.innerHTML = '<div class="fazenda-titulo">' + esc(fazenda) + '</div>';
      clientes.forEach(function(c) { wrap.appendChild(renderPulv(c)); });
      return wrap;
    }

    function renderPulv(c) {
      const pulv = c.pulverizador || {};
      const infos = [];
      if (pulv.modelo) infos.push('<strong>Modelo:</strong> ' + esc(pulv.modelo));
      if (c.pontas && c.pontas.length) infos.push('<strong>Pontas:</strong> ' + c.pontas.map(esc).join(', '));
      if (c.calibracao) infos.push('<strong>Calibracao:</strong> ' + esc(c.calibracao));
      if (c.observacao) infos.push('<strong>Obs:</strong> ' + esc(c.observacao));

      const div = document.createElement('div');
      div.className = 'pulv-item';
      const modelo = pulv.modelo || c.nome;
      div.innerHTML =
        '<div class="pulv-header">' +
          '<span class="pulv-modelo">' + esc(modelo) + '</span>' +
        '</div>' +
        '<div class="pulv-info">' + infos.join('<br>') + '</div>' +
        '<div class="cliente-acoes"></div>';
      const acoes = div.querySelector('.cliente-acoes');
      const btnEdit = document.createElement('button');
      btnEdit.className = 'btn btn-editar';
      btnEdit.textContent = 'Editar';
      btnEdit.addEventListener('click', function() { editar(c.id); });
      const btnDel = document.createElement('button');
      btnDel.className = 'btn btn-vermelho';
      btnDel.textContent = 'Excluir';
      btnDel.addEventListener('click', function() { excluir(c.id, c.nome); });
      acoes.appendChild(btnEdit);
      acoes.appendChild(btnDel);
      return div;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    function lerForm() {
      return {
        nome: document.getElementById('nome').value,
        pulverizador_modelo: document.getElementById('pulverizador_modelo').value,
        volume_tanque: document.getElementById('volume_tanque').value,
        pontas: document.getElementById('pontas').value,
        calibracao: document.getElementById('calibracao').value,
        observacao: document.getElementById('observacao').value,
      };
    }

    function preencherForm(c) {
      document.getElementById('editando-id').value = c.id;
      document.getElementById('nome').value = c.nome || '';
      document.getElementById('pulverizador_modelo').value = (c.pulverizador || {}).modelo || '';
      document.getElementById('volume_tanque').value = (c.pulverizador || {}).volume_tanque_L || '';
      document.getElementById('pontas').value = (c.pontas || []).join(', ');
      document.getElementById('calibracao').value = c.calibracao || '';
      document.getElementById('observacao').value = c.observacao || '';
      document.getElementById('form-titulo').textContent = 'Editando: ' + c.nome;
      document.getElementById('form-card').scrollIntoView({ behavior: 'smooth' });
    }

    function limparForm() {
      document.getElementById('editando-id').value = '';
      document.getElementById('nome').value = '';
      document.getElementById('pulverizador_modelo').value = '';
      document.getElementById('volume_tanque').value = '';
      document.getElementById('pontas').value = '';
      document.getElementById('calibracao').value = '';
      document.getElementById('observacao').value = '';
      document.getElementById('form-titulo').textContent = 'Nova Fazenda';
      document.getElementById('form-status').textContent = '';
    }

    async function salvar() {
      const dados = lerForm();
      if (!dados.nome.trim()) {
        mostrarStatus('Preencha o nome do cliente.', true);
        return;
      }
      const editId = document.getElementById('editando-id').value;
      const url = editId ? API + '/' + editId : API;
      const method = editId ? 'PUT' : 'POST';

      try {
        const resp = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados),
        });
        const resultado = await resp.json();
        if (!resp.ok) {
          mostrarStatus('Erro: ' + (resultado.erro || 'falha'), true);
          return;
        }
        mostrarStatus(editId ? 'Fazenda atualizada!' : 'Fazenda cadastrada!', false);
        limparForm();
        carregarClientes();
      } catch (e) {
        mostrarStatus('Erro de conexao: ' + e.message, true);
      }
    }

    async function editar(id) {
      try {
        const resp = await fetch(API + '/' + id);
        if (!resp.ok) { mostrarStatus('Cliente não encontrado.', true); return; }
        const c = await resp.json();
        preencherForm(c);
      } catch (e) {
        mostrarStatus('Erro ao carregar cliente.', true);
      }
    }

    async function excluir(id, nome) {
      if (!confirm('Excluir o cliente "' + nome + '"?')) return;
      try {
        const resp = await fetch(API + '/' + id, { method: 'DELETE' });
        if (resp.ok) {
          carregarClientes();
          const editId = document.getElementById('editando-id').value;
          if (editId === id) limparForm();
        }
      } catch (e) {
        mostrarStatus('Erro ao excluir.', true);
      }
    }

    function mostrarStatus(msg, erro) {
      const el = document.getElementById('form-status');
      el.textContent = msg;
      el.style.color = erro ? '#C62828' : '#267A25';
      if (!erro) setTimeout(() => { el.textContent = ''; }, 3000);
    }

    carregarClientes();
  </script>
</body>
</html>

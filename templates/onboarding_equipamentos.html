<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FieldMix — Minha Fazenda</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 24px 16px 40px; }
    .card { background: white; border-radius: 12px; padding: 36px 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); width: 100%; max-width: 560px; }
    .logo-wrap { text-align: center; margin-bottom: 16px; }
    .logo-wrap img { height: 56px; }
    h1 { font-size: 20px; color: #10315A; font-weight: 700; margin-bottom: 4px; text-align: center; }
    p.sub { font-size: 13px; color: #777; text-align: center; margin-bottom: 8px; }
    .step { font-size: 12px; color: #aaa; text-align: center; margin-bottom: 24px; }
    .secao-titulo {
      font-size: 13px; font-weight: 700; color: #10315A; text-transform: uppercase;
      letter-spacing: .5px; margin: 24px 0 12px; padding-bottom: 6px;
      border-bottom: 2px solid #e8edf4; display: flex; align-items: center; gap: 8px;
    }
    .secao-titulo:first-of-type { margin-top: 0; }
    .bloco {
      border: 1px solid #dde; border-radius: 8px; padding: 16px 16px 10px;
      margin-bottom: 12px; position: relative; background: #fafcff;
    }
    .bloco-titulo { font-size: 13px; font-weight: 700; color: #10315A; margin-bottom: 12px; }
    .linha { display: flex; gap: 12px; }
    .campo { flex: 1; margin-bottom: 10px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #555; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .4px; }
    input, textarea {
      width: 100%; border: 1px solid #ccc; border-radius: 6px;
      padding: 9px 11px; font-size: 14px; font-family: inherit;
    }
    input:focus, textarea:focus { outline: none; border-color: #267A25; box-shadow: 0 0 0 2px rgba(38,122,37,.15); }
    textarea { resize: vertical; min-height: 60px; }
    .hint { font-size: 11px; color: #aaa; margin-top: 3px; }
    .btn-remover {
      position: absolute; top: 12px; right: 14px;
      background: none; border: none; color: #c62828; cursor: pointer;
      font-size: 18px; line-height: 1; padding: 2px;
    }
    .btn-remover:hover { color: #8b0000; }
    .btn-add {
      width: 100%; background: #f0f4f8; color: #10315A; border: 2px dashed #b0c0d0;
      border-radius: 8px; padding: 10px; font-size: 13px; font-weight: 600;
      cursor: pointer; margin-bottom: 8px;
    }
    .btn-add:hover { background: #e3ecf5; }
    .btn-salvar {
      width: 100%; background: #267A25; color: white; border: none;
      border-radius: 6px; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer;
      margin-top: 20px;
    }
    .btn-salvar:hover { background: #1e6020; }
    .btn-pular { width: 100%; background: none; border: none; color: #aaa; font-size: 13px; cursor: pointer; margin-top: 12px; text-decoration: underline; }
    .btn-pular:hover { color: #666; }
    @media (max-width: 480px) { .card { padding: 24px 16px; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap"><img src="/static/logo.png" alt="FieldMix"></div>
    <h1>Minha Fazenda</h1>
    <p class="sub">Configure seus equipamentos e talhões. Pode editar depois.</p>
    <p class="step">Passo 2 de 2</p>

    <form id="form-dados" method="POST">
      <input type="hidden" name="pulverizadores_json" id="pulverizadores_json">
      <input type="hidden" name="talhoes_json" id="talhoes_json">

      <!-- NOME DA FAZENDA -->
      <div class="campo" style="margin-bottom:20px;">
        <label>Nome da fazenda</label>
        <input type="text" name="nome_fazenda" id="nome_fazenda" placeholder="Ex: Fazenda Boa Vista" style="font-size:15px;">
      </div>

      <!-- PULVERIZADORES -->
      <div class="secao-titulo">🚜 Pulverizadores</div>
      <div id="lista-pulv"></div>
      <button type="button" class="btn-add" id="btn-add-pulv">+ Adicionar pulverizador</button>

      <!-- TALHÕES -->
      <div class="secao-titulo">🌾 Talhões</div>
      <div id="lista-talhoes"></div>
      <button type="button" class="btn-add" id="btn-add-talhao">+ Adicionar talhão</button>

      <button type="submit" class="btn-salvar">Salvar e entrar →</button>
      <button type="button" class="btn-pular" id="btn-pular">Pular por agora</button>
    </form>
  </div>

  <script>
    let cntPulv = 0, cntTalhao = 0;

    /* ── Pulverizadores ── */
    function criarPulv() {
      cntPulv++;
      const n = cntPulv;
      const bloco = document.createElement('div');
      bloco.className = 'bloco';
      bloco.dataset.id = 'p' + n;
      bloco.innerHTML = `
        <div class="bloco-titulo">Pulverizador ${n}</div>
        ${n > 1 ? `<button type="button" class="btn-remover" onclick="removerBloco('p${n}')">✕</button>` : ''}
        <div class="campo">
          <label>Nome / Modelo</label>
          <input type="text" placeholder="Ex: Jacto Uniport 2500, Montana AM-30..." data-campo="nome">
        </div>
        <div class="linha">
          <div class="campo">
            <label>Volume do tanque (L)</label>
            <input type="number" step="1" min="0" placeholder="Ex: 2000" data-campo="volume_tanque_L">
          </div>
          <div class="campo">
            <label>Taxa de aplicação (L/ha)</label>
            <input type="number" step="0.1" min="0" placeholder="Ex: 150" data-campo="vazao_L_ha">
          </div>
        </div>
        <div class="campo">
          <label>Pontas</label>
          <input type="text" placeholder="Ex: TT 11001, CVE 9001" data-campo="pontas">
          <div class="hint">Separe por vírgula se tiver mais de uma</div>
        </div>
        <div class="campo">
          <label>Hectares / tanque (ha)</label>
          <input type="number" step="0.1" min="0" placeholder="Calculado automaticamente" data-campo="area_tanque_ha" readonly style="background:#f5f7fa;color:#555;">
        </div>
        <div class="campo">
          <label>Observações (opcional)</label>
          <textarea placeholder="Ex: Sempre 200L de água no início..." data-campo="observacao"></textarea>
        </div>
      `;
      document.getElementById('lista-pulv').appendChild(bloco);

      // Cálculo automático: ha/tanque = volume / taxa
      function calcularHa() {
        const vol = parseFloat(bloco.querySelector('[data-campo="volume_tanque_L"]').value);
        const taxa = parseFloat(bloco.querySelector('[data-campo="vazao_L_ha"]').value);
        const haInput = bloco.querySelector('[data-campo="area_tanque_ha"]');
        if (vol > 0 && taxa > 0) {
          haInput.value = (vol / taxa).toFixed(1);
        } else {
          haInput.value = '';
        }
      }
      bloco.querySelector('[data-campo="volume_tanque_L"]').addEventListener('input', calcularHa);
      bloco.querySelector('[data-campo="vazao_L_ha"]').addEventListener('input', calcularHa);
    }

    /* ── Talhões ── */
    function criarTalhao() {
      cntTalhao++;
      const n = cntTalhao;
      const bloco = document.createElement('div');
      bloco.className = 'bloco';
      bloco.dataset.id = 't' + n;
      bloco.innerHTML = `
        <div class="bloco-titulo">Talhão ${n}</div>
        ${n > 1 ? `<button type="button" class="btn-remover" onclick="removerBloco('t${n}')">✕</button>` : ''}
        <div class="linha">
          <div class="campo" style="flex:2;">
            <label>Nome do talhão</label>
            <input type="text" placeholder="Ex: Talhão Norte, Área A" data-campo="nome">
          </div>
          <div class="campo">
            <label>Área (ha)</label>
            <input type="number" step="0.1" min="0" placeholder="Ex: 45" data-campo="area_ha">
          </div>
        </div>
      `;
      document.getElementById('lista-talhoes').appendChild(bloco);
      renumerarTalhoes();
    }

    function removerBloco(id) {
      const el = document.querySelector(`.bloco[data-id="${id}"]`);
      if (el) el.remove();
      if (id.startsWith('p')) renumerarPulv();
      else renumerarTalhoes();
    }

    function renumerarPulv() {
      document.querySelectorAll('#lista-pulv .bloco').forEach((b, i) => {
        b.querySelector('.bloco-titulo').textContent = `Pulverizador ${i + 1}`;
      });
    }

    function renumerarTalhoes() {
      document.querySelectorAll('#lista-talhoes .bloco').forEach((b, i) => {
        b.querySelector('.bloco-titulo').textContent = `Talhão ${i + 1}`;
      });
    }

    function coletarPulv() {
      return Array.from(document.querySelectorAll('#lista-pulv .bloco')).map(b => {
        const obj = {};
        b.querySelectorAll('[data-campo]').forEach(el => {
          const k = el.dataset.campo;
          const v = el.value.trim();
          if (k === 'pontas') {
            obj[k] = v ? v.split(',').map(s => s.trim()).filter(Boolean) : [];
          } else if (['volume_tanque_L','vazao_L_ha','pressao_bar','area_tanque_ha'].includes(k)) {
            obj[k] = v !== '' ? parseFloat(v) : null;
          } else {
            obj[k] = v;
          }
        });
        return obj;
      });
    }

    function coletarTalhoes() {
      return Array.from(document.querySelectorAll('#lista-talhoes .bloco')).map(b => {
        const obj = {};
        b.querySelectorAll('[data-campo]').forEach(el => {
          const k = el.dataset.campo;
          const v = el.value.trim();
          obj[k] = k === 'area_ha' ? (v !== '' ? parseFloat(v) : null) : v;
        });
        return obj;
      }).filter(t => t.nome);
    }

    document.getElementById('btn-add-pulv').addEventListener('click', criarPulv);
    document.getElementById('btn-add-talhao').addEventListener('click', criarTalhao);

    document.getElementById('btn-pular').addEventListener('click', function() {
      document.getElementById('pulverizadores_json').value = '[]';
      document.getElementById('talhoes_json').value = '[]';
      document.getElementById('form-dados').submit();
    });

    document.getElementById('form-dados').addEventListener('submit', function() {
      document.getElementById('pulverizadores_json').value = JSON.stringify(coletarPulv());
      document.getElementById('talhoes_json').value = JSON.stringify(coletarTalhoes());
    });

    criarPulv();
    criarTalhao();
  </script>
</body>
</html>

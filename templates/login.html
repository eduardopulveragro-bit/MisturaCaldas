<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FieldMix — Entrar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: white; border-radius: 10px; padding: 40px 36px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); width: 100%; max-width: 380px; }
    .logo-wrap { text-align: center; margin-bottom: 28px; }
    .logo-wrap img { height: 72px; }
    h1 { font-size: 20px; color: #10315A; margin-bottom: 24px; text-align: center; font-weight: 700; }
    label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 5px; }
    input { width: 100%; border: 1px solid #ccc; border-radius: 6px; padding: 10px 12px; font-size: 14px; margin-bottom: 16px; }
    input:focus { outline: none; border-color: #267A25; box-shadow: 0 0 0 2px rgba(38,122,37,0.15); }
    .btn { width: 100%; background: #10315A; color: white; border: none; border-radius: 6px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px; }
    .btn:hover { background: #1a4070; }
    .erro { background: #fce4e4; color: #C62828; border-radius: 6px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="/static/logo.png" alt="FieldMix">
    </div>
    <h1>Entrar</h1>
    {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
    <form method="POST">
      <label>Email</label>
      <input type="email" name="email" autocomplete="email" required autofocus>
      <label>Senha</label>
      <input type="password" name="senha" autocomplete="current-password" required>
      <button class="btn" type="submit">Entrar</button>
    </form>
    <div style="text-align:center;margin-top:20px;font-size:13px;color:#777;">Não tem conta? <a href="{{ url_for('cadastro') }}" style="color:#10315A;font-weight:600;text-decoration:none;">Criar conta</a></div>
  </div>
</body>
</html>

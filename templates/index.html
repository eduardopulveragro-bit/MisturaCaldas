<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FieldMix</title>
  <meta name="theme-color" content="#10315A">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="icon" href="/static/icon-192.png" type="image/png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #1a1a2e; }
    header {
      background: white;
      color: #10315A; padding: 10px 28px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .header-brand { display: flex; align-items: center; text-decoration: none; }
    .header-brand img { height: 110px; display: block; }
    header a.nav-link { color: #10315A; text-decoration: none; font-size: 13px; font-weight: 600; }
    header a.nav-link:hover { color: #267A25; }
    main { max-width: 900px; margin: 20px auto; padding: 0 16px; }
    .card { background: white; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #10315A; }
    textarea { width: 100%; border: 1px solid #ccc; border-radius: 6px; padding: 10px 12px; font-size: 14px; height: 140px; resize: vertical; font-family: monospace; }
    textarea:focus { outline: none; border-color: #267A25; box-shadow: 0 0 0 2px rgba(38,122,37,0.15); }
    .campos-operacao {
      display: flex; gap: 12px; margin-bottom: 16px;
    }
    .campo-num {
      flex: 1;
    }
    .campo-num input {
      width: 100%; border: 1px solid #ccc; border-radius: 6px;
      padding: 10px 12px; font-size: 15px; text-align: center;
    }
    .campo-num input:focus { outline: none; border-color: #267A25; box-shadow: 0 0 0 2px rgba(38,122,37,0.15); }
    .campo-num .unidade { font-size: 11px; color: #888; text-align: center; margin-top: 3px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #10315A; color: white; border: none; border-radius: 6px;
      padding: 12px 28px; font-size: 15px; font-weight: 600; cursor: pointer;
      margin-top: 16px; width: 100%;
      justify-content: center;
    }
    .btn:hover { background: #1a4070; }
    .btn:disabled { background: #9e9e9e; cursor: not-allowed; }
    #status { margin-top: 14px; font-size: 14px; min-height: 20px; }
    .erro { color: #C62828; font-weight: 600; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .exemplo { font-size: 12px; color: #666; margin-top: 8px; margin-bottom: 16px; background: #f8f8f8; padding: 10px; border-radius: 4px; font-family: monospace; line-height: 1.6; }

    #resultado { display: none; }
    #resultado h2 { font-size: 16px; color: #10315A; margin-bottom: 12px; }
    .operacao-info { font-size: 13px; color: #555; margin-bottom: 12px; font-style: italic; }
    table.ordem { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.ordem th { background: #10315A; color: white; padding: 6px 8px; text-align: center; font-weight: 600; font-size: 12px; }
    table.ordem th:nth-child(2) { text-align: left; }
    table.ordem td { padding: 6px 8px; border-bottom: 1px solid #e0e0e0; vertical-align: top; text-align: center; }
    table.ordem td:nth-child(2) { text-align: left; }
    .prediluicao { display: block; font-size: 12px; color: #267A25; font-weight: 600; text-transform: uppercase; margin-top: 4px; }
    .col-num { width: 28px; }
    .col-dose { white-space: nowrap; }

    #pergunta-form { display: none; }
    #pergunta-form h2 { font-size: 15px; color: #E65100; margin-bottom: 4px; }
    #pergunta-form p { font-size: 13px; color: #666; margin-bottom: 14px; }
    .pergunta-item { margin-bottom: 12px; }
    .pergunta-item label { font-size: 14px; color: #1a1a2e; font-weight: 600; margin-bottom: 4px; }
    .pergunta-item select {
      width: 100%; border: 1px solid #ccc; border-radius: 6px;
      padding: 10px 12px; font-size: 14px; background: white;
    }
    .pergunta-item select:focus { outline: none; border-color: #267A25; box-shadow: 0 0 0 2px rgba(38,122,37,0.15); }
    .btn-secundario {
      display: inline-flex; align-items: center; gap: 8px;
      background: #E65100; color: white; border: none; border-radius: 6px;
      padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
      margin-top: 8px; width: 100%; justify-content: center;
    }
    .btn-secundario:hover { background: #BF360C; }
    .btn-pdf {
      display: inline-flex; align-items: center; gap: 8px;
      background: #267A25; color: white; border: none; border-radius: 6px;
      padding: 12px 28px; font-size: 15px; font-weight: 600; cursor: pointer;
      margin-top: 16px; width: 100%; justify-content: center;
    }
    .btn-pdf:hover { background: #5FB038; }

    .alerta-incomp {
      border-radius: 6px; padding: 10px 14px; margin-bottom: 10px;
      font-size: 13px; font-weight: 600; line-height: 1.5;
      display: flex; gap: 10px; align-items: flex-start;
    }
    .alerta-incomp-alto {
      background: #FFF3CD; border-left: 4px solid #E65100; color: #7A3600;
    }
    .alerta-incomp-medio {
      background: #FFF8E1; border-left: 4px solid #F9A825; color: #5D4000;
    }
    .alerta-incomp-icone { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    #alertas-incomp-box { margin-bottom: 14px; }

    @media (max-width: 600px) {
      .card { padding: 16px; }
      table.ordem { font-size: 12px; }
      table.ordem th, table.ordem td { padding: 5px 4px; }
      header { padding: 14px 16px; }
      header h1 { font-size: 17px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="header-brand">
      <img src="/static/logo.png" alt="FieldMix">
    </a>
    <a href="/clientes" class="nav-link">Clientes &rarr;</a>
  </header>

  <main>
    <div class="card">
      <form id="form">
        <div style="margin-bottom: 14px;">
          <label for="cliente-sel">Cliente</label>
          <select id="cliente-sel" style="width:100%;border:1px solid #ccc;border-radius:6px;padding:10px 12px;font-size:14px;background:white;">
            <option value="">-- Sem cliente --</option>
          </select>
        </div>
        <div style="margin-bottom: 14px;">
          <label for="nome-aplicacao">Nome da aplicação (aparece no PDF)</label>
          <input type="text" id="nome-aplicacao" placeholder="Ex: Dessecação Canola — Talhão 2" style="width:100%;border:1px solid #ccc;border-radius:6px;padding:10px 12px;font-size:14px;">
        </div>
        <div class="campos-operacao">
          <div class="campo-num">
            <label for="vazao">Taxa de aplicação</label>
            <input type="number" id="vazao" name="vazao" placeholder="80" min="1" step="any">
            <div class="unidade">L/ha</div>
          </div>
          <div class="campo-num">
            <label for="area">Hectares por tanque</label>
            <input type="number" id="area" name="area" placeholder="50" min="1" step="any">
            <div class="unidade">ha</div>
          </div>
        </div>

        <div id="pontas-pressao" style="display:none;margin-bottom:16px;">
          <div class="campos-operacao">
            <div class="campo-num" style="flex:2;">
              <label for="ponta-sel">Ponta</label>
              <select id="ponta-sel" style="width:100%;border:1px solid #ccc;border-radius:6px;padding:10px 12px;font-size:14px;background:white;">
                <option value="">-- Selecione a ponta --</option>
              </select>
            </div>
            <div class="campo-num">
              <label for="pressao">Pressão</label>
              <div style="display:flex;gap:6px;">
                <input type="text" id="pressao" placeholder="Ex: 2.5 ou 250 a 300" style="flex:1;border:1px solid #ccc;border-radius:6px;padding:10px 12px;font-size:14px;text-align:center;">
                <select id="pressao-unidade" style="border:1px solid #ccc;border-radius:6px;padding:10px 8px;font-size:14px;background:white;">
                  <option value="bar">bar</option>
                  <option value="PSI">PSI</option>
                  <option value="kPa">kPa</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div>
          <label for="mensagem">Produtos (cole a mensagem do aplicador)</label>
          <textarea id="mensagem" name="mensagem" placeholder="Cole aqui a lista de produtos...&#10;&#10;Exemplo:&#10;Roundup 2 L/ha&#10;Engeo Pleno S 200 mL/ha&#10;Score 0,5 L/ha&#10;Nimbus 0,5 L/ha" required></textarea>
        </div>

        <div style="margin-top: 12px;">
          <label for="observacao">Observação (aparece no PDF)</label>
          <textarea id="observacao" name="observacao" style="height:50px;resize:vertical;" placeholder="Ex: Colocar 500L de água antes de adicionar produtos."></textarea>
        </div>

        <button type="submit" class="btn" id="btn">
          <span id="btn-text">Gerar Ordem</span>
        </button>

        <div id="status"></div>
      </form>
    </div>

    <div id="pergunta-form" class="card">
      <h2>Produto nao encontrado</h2>
      <p>Verifique na bula ou embalagem do produto qual a formulacao.</p>
      <div id="perguntas-lista"></div>
      <button type="button" class="btn-secundario" id="btn-confirmar-form">
        Atualizar Ordem
      </button>
    </div>

    <div id="resultado" class="card">
      <h2>ORDEM DE ADIÇÃO NA CALDA</h2>
      <div id="operacao-info" class="operacao-info"></div>
      <div id="alertas-incomp-box"></div>
      <table class="ordem">
        <thead>
          <tr>
            <th class="col-num">#</th>
            <th>Produto</th>
            <th>Form.</th>
            <th>Dose/ha</th>
            <th id="th-tanque" style="display:none;">Dose/tanque</th>
          </tr>
        </thead>
        <tbody id="tabela-corpo"></tbody>
      </table>
      <button type="button" class="btn-pdf" id="btn-pdf" style="display:none;" onclick="gerarPDF()">
        Baixar PDF
      </button>
    </div>
  </main>

  <img id="logo-pdf" src="/static/logo.png" style="display:none;">
  <img id="logo-pulveragro" src="/static/pulveragro.jpg" style="display:none;">
  <script src="/static/jspdf.umd.min.js"></script>
  <script src="/static/jspdf.plugin.autotable.min.js"></script>
  <script>
    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    const btnText = document.getElementById('btn-text');
    const status = document.getElementById('status');
    const resultado = document.getElementById('resultado');
    const tabelaCorpo = document.getElementById('tabela-corpo');
    const operacaoInfo = document.getElementById('operacao-info');
    const thTanque = document.getElementById('th-tanque');
    const perguntaForm = document.getElementById('pergunta-form');
    const perguntasLista = document.getElementById('perguntas-lista');
    const btnConfirmar = document.getElementById('btn-confirmar-form');

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    let dadosAtual = null;
    const clienteSel = document.getElementById('cliente-sel');
    const obsField = document.getElementById('observacao');

    (async function carregarClientes() {
      try {
        const resp = await fetch('/api/clientes');
        const clientes = await resp.json();
        clientes.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = c.nome;
          opt.dataset.cliente = JSON.stringify(c);
          clienteSel.appendChild(opt);
        });
      } catch (e) {}
    })();

    const pontaSel = document.getElementById('ponta-sel');
    const pressaoField = document.getElementById('pressao');
    const pontasPressaoDiv = document.getElementById('pontas-pressao');

    clienteSel.addEventListener('change', function() {
      const opt = this.selectedOptions[0];
      pontaSel.innerHTML = '<option value="">-- Selecione a ponta --</option>';
      pressaoField.value = '';
      if (!opt || !opt.dataset.cliente) {
        pontasPressaoDiv.style.display = 'none';
        return;
      }
      const c = JSON.parse(opt.dataset.cliente);
      if (c.vazao_L_ha) document.getElementById('vazao').value = c.vazao_L_ha;
      if (c.area_tanque_ha) document.getElementById('area').value = c.area_tanque_ha;
      obsField.value = c.observacao || '';

      if (c.pontas && c.pontas.length > 0) {
        c.pontas.forEach(p => {
          const o = document.createElement('option');
          o.value = p;
          o.textContent = p;
          pontaSel.appendChild(o);
        });
        pontasPressaoDiv.style.display = 'block';
      } else {
        pontasPressaoDiv.style.display = 'none';
      }
    });

    const OPCOES_FORM = [
      {grupo: 'Solidos', opts: [['WG','WG — Granulado Dispersivel'],['WP','WP — Po Molhavel'],['SG','SG — Granulado Soluvel'],['SP','SP — Po Soluvel']]},
      {grupo: 'Suspensoes', opts: [['SC','SC — Suspensao Concentrada'],['CS','CS — Suspensao Encapsulada'],['OD','OD — Dispersao de Oleo']]},
      {grupo: 'Emulsoes', opts: [['SE','SE — Suspo-Emulsao'],['EC','EC — Concentrado Emulsionavel'],['EW','EW — Emulsao Oleo em Agua'],['EO','EO — Emulsao Agua em Oleo'],['ME','ME — Microemulsao']]},
      {grupo: 'Soluvel', opts: [['SL','SL — Concentrado Soluvel']]},
      {grupo: 'Especiais', opts: [['OLEO','Oleo mineral / vegetal'],['ADJUVANTE','Adjuvante / Espalhante'],['CONDICIONADOR','Condicionador de pH'],['FERTILIZANTE','Fertilizante foliar'],['ANTIESPUMANTE','Antiespumante']]},
      {grupo: 'Biologicos', opts: [['BIO_BACTERIANO','Bio Bacteriano (Bacillus subtilis / thuringiensis)'],['BIO_FUNGICO','Bio Fungico (Trichoderma / Beauveria / Metarhizium)'],['BIO_VIRAL','Bio Viral (Baculovirus / Granulovirus)']]},
    ];

    function criarSelect(nomeProduto) {
      const div = document.createElement('div');
      div.className = 'pergunta-item';
      const lbl = document.createElement('label');
      lbl.textContent = nomeProduto;
      const sel = document.createElement('select');
      sel.dataset.produto = nomeProduto;
      const optVazio = document.createElement('option');
      optVazio.value = '';
      optVazio.textContent = 'Selecione a formulacao...';
      sel.appendChild(optVazio);
      OPCOES_FORM.forEach(g => {
        const og = document.createElement('optgroup');
        og.label = g.grupo;
        g.opts.forEach(([val, txt]) => {
          const o = document.createElement('option');
          o.value = val;
          o.textContent = txt;
          og.appendChild(o);
        });
        sel.appendChild(og);
      });
      div.appendChild(lbl);
      div.appendChild(sel);
      return div;
    }

    const alertasIncompBox = document.getElementById('alertas-incomp-box');

    function montarTabela(dados) {
      dadosAtual = dados;
      operacaoInfo.textContent = '';

      alertasIncompBox.innerHTML = '';
      const incomps = dados.alertas_incompatibilidade || [];
      incomps.forEach(al => {
        const div = document.createElement('div');
        div.className = 'alerta-incomp alerta-incomp-' + (al.nivel === 'alto' ? 'alto' : 'medio');
        div.innerHTML =
          '<span class="alerta-incomp-icone">' + (al.nivel === 'alto' ? '⚠️' : '⚡') + '</span>' +
          '<span>' + escHtml(al.mensagem) + '</span>';
        alertasIncompBox.appendChild(div);
      });

      if (dados.operacao) {
        const partes = [];
        if (dados.operacao.area_tanque_ha) partes.push('Tanque: ' + dados.operacao.area_tanque_ha + ' ha');
        if (dados.operacao.vazao_L_ha) partes.push('Taxa de aplicação: ' + dados.operacao.vazao_L_ha + ' L/ha');
        if (dados.operacao.ponta) partes.push('Ponta: ' + dados.operacao.ponta);
        if (partes.length) operacaoInfo.textContent = partes.join(' | ');
      }

      tabelaCorpo.innerHTML = '';
      const temTotais = dados.ordem.some(item => item.total_tanque != null);
      thTanque.style.display = temTotais ? '' : 'none';

      dados.ordem.forEach((item, i) => {
        const tr = document.createElement('tr');
        const formUpper = (item.formulacao || '').toUpperCase();
        const formDisplay = (formUpper === 'DESCONHECIDA') ? '—' : formUpper;

        const doseHa = (typeof item.dose === 'number' && item.unidade && item.unidade !== '—')
          ? item.dose + ' ' + item.unidade + '/' + (item.base || 'ha')
          : '—';

        let produtoHtml = '<strong>' + escHtml(item.produto) + '</strong>';
        if (item.alerta_prediluicao) {
          produtoHtml += '<span class="prediluicao">&gt;&gt; ' + escHtml(item.alerta_prediluicao) + '</span>';
        }

        let html =
          '<td class="col-num">' + (i + 1) + '</td>' +
          '<td>' + produtoHtml + '</td>' +
          '<td>' + formDisplay + '</td>' +
          '<td class="col-dose">' + doseHa + '</td>';

        if (temTotais) {
          const doseTanque = item.total_tanque != null
            ? '<strong>' + item.total_tanque + ' ' + item.total_unidade + '</strong>'
            : '—';
          html += '<td class="col-dose">' + doseTanque + '</td>';
        }

        tr.innerHTML = html;
        tabelaCorpo.appendChild(tr);
      });

      document.getElementById('btn-pdf').style.display = '';
      resultado.style.display = 'block';
      resultado.scrollIntoView({ behavior: 'smooth' });
    }

    async function enviar(formulacoesExtra) {
      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> Processando...';
      status.textContent = '';
      status.className = '';
      resultado.style.display = 'none';
      perguntaForm.style.display = 'none';

      const fd = new FormData(form);
      if (formulacoesExtra) {
        fd.set('formulacoes', JSON.stringify(formulacoesExtra));
      }

      try {
        const resp = await fetch('/processar', { method: 'POST', body: fd });
        const dados = await resp.json();

        if (!resp.ok) {
          status.textContent = 'Erro: ' + (dados.erro || 'falha desconhecida');
          status.className = 'erro';
          return;
        }

        const desconhecidos = dados.ordem.filter(it => (it.formulacao || '').toUpperCase() === 'DESCONHECIDA');

        if (desconhecidos.length > 0 && !formulacoesExtra) {
          perguntasLista.innerHTML = '';
          desconhecidos.forEach(it => {
            perguntasLista.appendChild(criarSelect(it.produto));
          });
          perguntaForm.style.display = 'block';
          perguntaForm.scrollIntoView({ behavior: 'smooth' });
          montarTabela(dados);
        } else {
          montarTabela(dados);
        }

      } catch (err) {
        status.textContent = 'Erro de conexao: ' + err.message;
        status.className = 'erro';
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Gerar Ordem';
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      enviar(null);
    });

    btnConfirmar.addEventListener('click', () => {
      const selects = perguntasLista.querySelectorAll('select');
      const formulacoes = {};
      let algumPreenchido = false;
      selects.forEach(sel => {
        if (sel.value) {
          formulacoes[sel.dataset.produto] = sel.value;
          algumPreenchido = true;
        }
      });
      if (!algumPreenchido) return;
      enviar(formulacoes);
    });

    function calcularTotalTanque(dose, unidade, area) {
      if (!dose || !area) return null;
      var total = dose * area;
      var un = (unidade || '').toLowerCase();
      if (un === 'l' || un === 'lt') {
        return Math.round(total * 100) / 100 + ' L';
      } else if (un === 'ml') {
        if (total >= 1000) return Math.round(total / 10) / 100 + ' L';
        return Math.round(total) + ' mL';
      } else if (un === 'kg') {
        return Math.round(total * 100) / 100 + ' kg';
      } else if (un === 'g' || un === 'gr') {
        if (total >= 1000) return Math.round(total / 10) / 100 + ' kg';
        return Math.round(total) + ' g';
      }
      return Math.round(total * 100) / 100 + ' ' + unidade;
    }

    function gerarPDF() {
      if (!dadosAtual) return;
      var jsPDF = window.jspdf.jsPDF;
      var doc = new jsPDF('p', 'mm', 'a4');
      var pw = doc.internal.pageSize.getWidth();
      var verde = [27, 94, 32];
      var y = 8;

      // Logo FieldMix (esquerda)
      var logoX = 15;
      var logoH = 22;
      var logoW = 0;
      var logo = document.getElementById('logo-pdf');
      if (logo.complete && logo.naturalWidth > 0) {
        logoW = logoH * (logo.naturalWidth / logo.naturalHeight);
        if (logoW > 35) { logoH = logoH * (35 / logoW); logoW = 35; }
        doc.addImage(logo, 'JPEG', logoX, y, logoW, logoH);
      }

      // Logo Pulveragro (direita)
      var logoPulv = document.getElementById('logo-pulveragro');
      if (logoPulv.complete && logoPulv.naturalWidth > 0) {
        var pulvH = logoH;
        var pulvW = pulvH * (logoPulv.naturalWidth / logoPulv.naturalHeight);
        if (pulvW > 60) { pulvH = pulvH * (60 / pulvW); pulvW = 60; }
        doc.addImage(logoPulv, 'JPEG', pw - 15 - pulvW, y + (logoH - pulvH) / 2, pulvW, pulvH);
      }

      var textX = logoW ? logoX + logoW + 6 : 15;

      // Titulo
      doc.setFontSize(17);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(27, 94, 32);
      doc.text('FieldMix', textX, y + 6);

      doc.setFontSize(10);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(100, 100, 100);
      doc.text('Mistura Certa', textX, y + 12);

      // Cliente
      var clienteOpt = document.getElementById('cliente-sel').selectedOptions[0];
      var clienteNome = (clienteOpt && clienteOpt.value) ? clienteOpt.textContent.trim() : '';
      var infoY = y + 17;
      if (clienteNome) {
        doc.setFontSize(10);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(40, 40, 40);
        doc.text('Cliente: ', textX, infoY);
        doc.setFont('helvetica', 'normal');
        doc.text(clienteNome, textX + doc.getTextWidth('Cliente: '), infoY);
        infoY += 5;
      }

      // Nome da aplicação
      var nomeApl = (document.getElementById('nome-aplicacao').value || '').trim();
      if (nomeApl) {
        doc.setFontSize(10);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(40, 40, 40);
        doc.text('Aplicação: ', textX, infoY);
        doc.setFont('helvetica', 'normal');
        doc.text(escHtml(nomeApl), textX + doc.getTextWidth('Aplicação: '), infoY);
        infoY += 5;
      }

      y = Math.max(y + logoH, infoY) + 3;

      // Linha separadora
      doc.setDrawColor(27, 94, 32);
      doc.setLineWidth(0.5);
      doc.line(15, y, pw - 15, y);
      y += 4;

      // Ponta + pressão (box verde)
      var pontaTxt = (document.getElementById('ponta-sel').value || '').trim();
      var pressaoTxt = (document.getElementById('pressao').value || '').trim();
      var pressaoUnidade = (document.getElementById('pressao-unidade').value || 'bar');
      if (pontaTxt || pressaoTxt) {
        doc.setFillColor(27, 94, 32);
        doc.roundedRect(15, y, pw - 30, 10, 2, 2, 'F');
        doc.setFontSize(11);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(255, 255, 255);
        var partesPonta = [];
        if (pontaTxt) partesPonta.push('Ponta: ' + pontaTxt);
        if (pressaoTxt) partesPonta.push('Pressão: ' + pressaoTxt + ' ' + pressaoUnidade);
        doc.text(partesPonta.join('   |   '), pw / 2, y + 6.5, { align: 'center' });
        doc.setFont('helvetica', 'normal');
        y += 13;
      }

      // Taxa / área / data numa linha
      var op = dadosAtual.operacao;
      var vazaoTxt = (op && op.vazao_L_ha) ? op.vazao_L_ha + ' L/ha' : '---';
      var areaTxt = (op && op.area_tanque_ha) ? op.area_tanque_ha + ' ha' : '---';
      var hoje = new Date();
      var dataTxt = hoje.toLocaleDateString('pt-BR');
      doc.setFontSize(10);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(80, 80, 80);
      doc.text('Taxa: ' + vazaoTxt + '   |   Área/tanque: ' + areaTxt + '   |   Data: ' + dataTxt, 15, y + 4);
      y += 9;

      doc.setDrawColor(200, 200, 200);
      doc.setLineWidth(0.2);
      doc.line(15, y, pw - 15, y);
      y += 4;

      var area = (op && op.area_tanque_ha) ? op.area_tanque_ha : null;
      var head = [['#', 'Produto', 'Form.', 'Dose/ha', 'Qtd/tanque']];

      var body = dadosAtual.ordem.map(function(item, i) {
        var formUpper = (item.formulacao || '').toUpperCase();
        var formDisplay = formUpper === 'DESCONHECIDA' ? '---' : formUpper;
        var doseHa = (typeof item.dose === 'number' && item.unidade && item.unidade !== '—')
          ? item.dose + ' ' + item.unidade + '/' + (item.base || 'ha')
          : '---';
        var nome = escHtml(item.produto);
        if (item.alerta_prediluicao) {
          nome += '\n>> ' + escHtml(item.alerta_prediluicao);
        }
        var qtdTanque = '---';
        if (item.total_tanque != null) {
          qtdTanque = item.total_tanque + ' ' + item.total_unidade;
        } else if (area && typeof item.dose === 'number' && item.unidade && item.unidade !== '—') {
          var calc = calcularTotalTanque(item.dose, item.unidade, area);
          if (calc) qtdTanque = calc;
        }
        return [String(i + 1), nome, formDisplay, doseHa, qtdTanque];
      });

      var colStyles = {
        0: { halign: 'center', cellWidth: 10 },
        1: { halign: 'left', cellWidth: 56 },
        2: { halign: 'center', cellWidth: 42 },
        3: { halign: 'center', cellWidth: 34 },
        4: { halign: 'center', cellWidth: 38 }
      };

      doc.autoTable({
        head: head,
        body: body,
        startY: y,
        margin: { left: 15, right: 15 },
        styles: {
          fontSize: 11,
          cellPadding: 3,
          lineColor: [200, 200, 200],
          lineWidth: 0.2,
          textColor: [30, 30, 30],
          font: 'helvetica'
        },
        headStyles: {
          fillColor: verde,
          textColor: [255, 255, 255],
          fontStyle: 'bold',
          halign: 'center',
          fontSize: 11
        },
        alternateRowStyles: {
          fillColor: [245, 248, 245]
        },
        columnStyles: colStyles,
        didParseCell: function(data) {
          if (data.section === 'body' && data.column.index === 1) {
            var txt = data.cell.raw || '';
            if (txt.indexOf('\n>>') !== -1) {
              data.cell.styles.fontSize = 10;
            }
          }
        }
      });

      var obsTexto = (document.getElementById('observacao').value || '').trim();
      if (obsTexto) {
        var finalY = doc.lastAutoTable.finalY + 8;
        doc.setFontSize(11);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(27, 94, 32);
        doc.text('Observação:', 15, finalY);
        finalY += 5;
        doc.setFontSize(10);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(60, 60, 60);
        var linhas = doc.splitTextToSize(obsTexto, pw - 30);
        doc.text(linhas, 15, finalY);
      }

      doc.setFontSize(9);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(150, 150, 150);
      doc.text('PulverAgro — Consultoria em Pulverização', pw / 2, 290, { align: 'center' });

      doc.save('ordem_mistura_calda.pdf');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FieldMix — Usuários</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #1a1a2e; }
    header { background: white; color: #10315A; padding: 10px 28px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
    .header-brand { display: flex; align-items: center; text-decoration: none; }
    .header-brand img { height: 72px; display: block; }
    header a.nav-link { color: #10315A; text-decoration: none; font-size: 13px; font-weight: 600; }
    header a.nav-link:hover { color: #267A25; }
    main { max-width: 820px; margin: 24px auto; padding: 0 16px; }
    .card { background: white; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    h2 { font-size: 16px; color: #10315A; margin-bottom: 16px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #10315A; color: white; padding: 8px 10px; text-align: left; font-size: 12px; }
    td { padding: 8px 10px; border-bottom: 1px solid #eee; vertical-align: middle; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .badge-ativo { background: #e8f5e9; color: #2e7d32; }
    .badge-inativo { background: #fce4e4; color: #c62828; }
    .badge-admin { background: #e3f2fd; color: #1565c0; margin-left: 4px; }
    .btn-sm { padding: 4px 12px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .btn-desativar { background: #fce4e4; color: #c62828; }
    .btn-ativar { background: #e8f5e9; color: #2e7d32; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .grupo { display: flex; flex-direction: column; }
    .grupo label { font-size: 12px; font-weight: 600; color: #555; margin-bottom: 4px; }
    .grupo input { border: 1px solid #ccc; border-radius: 5px; padding: 8px 10px; font-size: 13px; min-width: 160px; }
    .grupo input:focus { outline: none; border-color: #267A25; box-shadow: 0 0 0 2px rgba(38,122,37,0.15); }
    .admin-check { display: flex; align-items: center; gap: 5px; font-size: 13px; color: #444; padding-bottom: 2px; }
    .btn-criar { background: #10315A; color: white; border: none; border-radius: 5px; padding: 8px 20px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-criar:hover { background: #1a4070; }
    @media (max-width: 600px) {
      header { padding: 10px 16px; flex-direction: column; align-items: flex-start; gap: 6px; }
      .header-brand img { height: 55px; }
      header > div { flex-wrap: wrap; gap: 8px 14px !important; }
      header a.nav-link { font-size: 12px; }
      .card { padding: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="header-brand">
      <img src="/static/logo.png" alt="FieldMix">
    </a>
    <div style="display:flex;gap:20px;align-items:center;">
      <a href="/" class="nav-link">App</a>
      <a href="/logout" class="nav-link">Sair</a>
    </div>
  </header>

  <main>
    <div class="card">
      <h2>Usuários cadastrados</h2>
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Email</th>
            <th>Plano</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          {% for u in usuarios %}
          <tr>
            <td>
              {{ u.nome }}
              {% if u.admin %}<span class="badge badge-admin">admin</span>{% endif %}
            </td>
            <td>{{ u.email }}</td>
            <td>{{ u.plano or 'trial' }}</td>
            <td>
              {% if u.ativo %}
                <span class="badge badge-ativo">Ativo</span>
              {% else %}
                <span class="badge badge-inativo">Inativo</span>
              {% endif %}
            </td>
            <td>
              <form method="POST" action="/admin/usuarios/{{ u.id }}/toggle" style="display:inline;">
                {% if u.ativo %}
                  <button class="btn-sm btn-desativar" type="submit">Desativar</button>
                {% else %}
                  <button class="btn-sm btn-ativar" type="submit">Ativar</button>
                {% endif %}
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

    <div class="card">
      <h2>Adicionar usuário</h2>
      <form method="POST" action="/admin/usuarios/criar">
        <div class="form-row">
          <div class="grupo">
            <label>Nome</label>
            <input type="text" name="nome" required placeholder="João Silva">
          </div>
          <div class="grupo">
            <label>Email</label>
            <input type="email" name="email" required placeholder="joao@exemplo.com">
          </div>
          <div class="grupo">
            <label>Senha</label>
            <input type="password" name="senha" required minlength="6" placeholder="mín. 6 caracteres">
          </div>
          <div class="grupo">
            <label>&nbsp;</label>
            <label class="admin-check">
              <input type="checkbox" name="admin"> Admin
            </label>
          </div>
          <div class="grupo">
            <label>&nbsp;</label>
            <button class="btn-criar" type="submit">Criar</button>
          </div>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
